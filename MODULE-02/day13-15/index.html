<!DOCTYPE html>
<html lang="en">   
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Addis Restaurant food menu</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <>
        <header>
            <div class="logo">Addis Restaurant</div>
            <div class="search bar">
                <input type="text" placeholder="search for foods">
            </div>
        </header>

        <main>
            <section class="dishes-section">
                <h1>Dishes</h1>

                <div class="dishes-grid">
                    <div class="dish-card">
                        <h3>doro</h3>
                        <p><strong>catagory:</strong> Main <br>🌶️ Spicy</p>
                        <span class="price">500 ETB</span>
                        <button class="add-btn">+</button>
                    </div>
                </div>
            </section>

            <aside class=" cart-sidebar">
                <div class="cart-header">
                    <h2>My Cart</h2>
                </div>

                <div class="cart-items">
                    <div class="cart-item">
                        <div class="item-detail">
                            <div class="item-title">doro</div>
                        </div>
                        <div class="item-actions">
                            <div class="price">500 ETB</div>
                            <div class="qty-control">
                                <button class="qty-btn">-</button>
                                <span>1</span>
                                <button class="qty-btn">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>500 ETB</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span>500 ETB</span>
                    </div>

                    <button class="checkout-btn">Checkout</button>
                </div>
            </aside>
        </main>



        <footer>
            <div class="footer-logo">Addis Restaurant</div>
    
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Contact Support</a>
            </div>
    
            <div class="footer-copyright">
            © 2024 Addis Restaurant Inc. All rights reserved.
            </div>
        </footer>

        <script src="app.js"></script>
    </body>
